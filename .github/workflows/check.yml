# Runs `make check` (backend lint, types, tests including the content-rules guard and the
# tag-pin test; API client sync; the UI shell's hash check; frontend lint, types, tests) on
# every push and pull request. Adapted from Partner Track's check.yml: one job, no shards yet
# (Plaza's suite is small at PL-M0).
name: check

on:
  push:
  pull_request:

concurrency:
  group: check-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install backend dependencies
        run: uv sync --project backend --locked
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: make check
        run: make check
