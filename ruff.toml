# Shared lint settings for the backend, tools and scripts (TST's ruff.toml, PT's pyproject).
line-length = 100
target-version = "py312"
extend-exclude = ["backend/migrations/versions", "frontend"]

[lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[lint.isort]
known-first-party = ["plaza", "tests", "content_rules"]
known-third-party = ["simcore", "simcore_db", "simcore_llm", "simcore_testing"]
