# Local hooks only: they run the same tools `make check` runs (ruff from the backend's
# environment, the content-rules guard), so no hook downloads anything.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run --project backend ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend ruff format --check
        language: system
        types: [python]
      - id: content-rules
        name: content rules (ADR PL-0008)
        entry: uv run --project backend python tools/content_rules/lint.py
        language: system
        pass_filenames: false
