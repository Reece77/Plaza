[project]
name = "plaza"
version = "0.0.0"
description = "Plaza: simulation, persistence, API and CLI on sim-core"
requires-python = ">=3.12,<3.13"
# ADR PL-0001 (amended 2026-11-27): Plaza depends on sim-core by tag, never by branch or commit;
# tests/unit/test_core_pin.py fails on any other pin. The rest is TST ADR-0001's list.
dependencies = [
    "simcore[db,llm] @ git+https://github.com/Reece77/sim-core@v0.1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
plaza = "plaza.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "httpx>=0.27",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.mypy]
python_version = "3.12"
packages = ["plaza"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["plaza.sim", "plaza.sim.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p simcore_testing.plugin"
markers = [
    "nightly: the long runs (`make nightly`, CI's nightly.yml)",
]
